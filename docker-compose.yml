services:
  worker: &worker-base
    image: odoo:17.0-ris
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./third_party:/mnt/third_party
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - ODOO_LOAD_MODULES=web,queue_job
      - ODOO_WORKERS=2
  web-dev:
    <<: *worker-base
    ports:
      - 8069:8069
      - 8072:8072
    working_dir: /mnt/extra-addons
    command: sleep infinity
    environment:
      - ODOO_LOAD_MODULES=web
      - ODOO_WORKERS=0

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
volumes:
  odoo-web-data:
  odoo-db-data:
